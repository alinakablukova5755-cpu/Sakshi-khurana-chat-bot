</html><!DOCTYPE html>

</head>
<body class="bg-gradient-to-br from-slate-100 via-pink-50/40 to-amber-50/40 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans text-slate-800 antialiased selection:bg-pink-500 selection:text-white">

    <!-- =====================================================================
         CUSTOMIZATION GUIDE FOR SAKSHI:
         1. Profile Picture: Search for "PROFILE_AVATAR" below and replace the
            src URL with your own photo link (or 'profile.jpg' on GitHub).
         2. Instagram Link: Already set to your exact Instagram URL.
         3. WhatsApp Number: Already set to +91 7533947819 with pre-filled text.
         ===================================================================== -->

    <!-- Main Mobile-First Card Container -->
    <main class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-slate-200/80 border border-slate-100 overflow-hidden flex flex-col">

        <!-- Top Instagram-Style Header -->
        <header class="bg-white border-b border-slate-100 p-4 sm:p-5">
            <div class="flex items-center justify-between gap-3">
                <!-- Avatar + Handle & Status -->
                <div class="flex items-center gap-3.5 min-w-0">
                    <!-- Instagram Gradient Story Ring -->
                    <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       aria-label="Visit Sakshi Khurana on Instagram"
                       class="relative shrink-0 p-[3px] rounded-full bg-gradient-to-tr from-amber-400 via-pink-500 to-purple-600 hover:scale-105 transition-transform duration-200">
                        <div class="bg-white p-[2px] rounded-full">
                            <!-- PROFILE_AVATAR: Replace the src URL below with your own image link -->
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=256&q=80" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/150x150/ec4899/ffffff?text=SK';"

                        </div>
                        <!-- Live Online Dot -->
                        <span class="absolute bottom-0.5 right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span>
                    </a>

                    <!-- Name, Handle & Verified Badge -->
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-bold text-slate-900 text-base sm:text-lg truncate">Sakshi Khurana</h1>
                            <i class="fa-solid fa-circle-check text-sky-500 text-sm shrink-0" title="Verified"></i>
                        </div>
                        <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           class="text-xs sm:text-sm font-medium text-pink-600 hover:text-pink-700 truncate block">
                            @sakshi.khurana.inn

                        <p class="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5">

                        </p>
                    </div>
                </div>

                <!-- Follow / View Instagram Button -->
                <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-white bg-gradient-to-r from-amber-500 via-pink-500 to-purple-600 hover:opacity-95 active:scale-95 transition-all shadow-sm">
                    <i class="fa-brands fa-instagram text-base"></i>
                    <span>Follow</span>
                </a>
            </div>

            <!-- Short Bio Strip -->
            <div class="mt-3.5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
                <span>✨ Helping you grow &amp; earn digitally</span>
                <span class="font-medium text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">Replies fast</span>
            </div>
        </header>

        <!-- Interactive Demo Chat Section -->
        <section class="bg-slate-50/80 flex-1 flex flex-col">
            <!-- Chat Window Sub-header -->
            <div class="px-4 py-2.5 bg-slate-100/80 border-b border-slate-200/60 flex items-center justify-between text-[11px] font-medium text-slate-500">
                <span class="flex items-center gap-1.5">
                    <i class="fa-regular fa-comment-dots text-pink-500"></i>
                    Direct Message Preview
                </span>
                <button type="button" id="resetDemoBtn" class="text-slate-500 hover:text-slate-800 underline underline-offset-2 transition-colors">
                    Replay 
                </button>
            </div>

            <!-- Messages Feed -->
            <div id="chatMessages" class="p-4 space-y-3.5 min-h-[290px] max-h-[380px] overflow-y-auto scroll-smooth">
                <!-- Timestamp -->
                <div class="text-center">
                    <span class="text-[11px] font-medium text-slate-400 bg-white px-2.5 py-0.5 rounded-full border border-slate-100">Today</span>
                </div>

                <!-- Messages will be dynamically injected here by JS -->
            </div>

            <!-- Quick Reply Suggestion Chips -->
            <div class="px-4 pb-2 pt-1 flex flex-wrap gap-2">
                <button type="button" 
                        data-message="Hey, I want to start with you!"
                        class="quick-reply-btn text-xs font-medium bg-white hover:bg-pink-50 text-slate-700 hover:text-pink-600 border border-slate-200 hover:border-pink-200 px-3 py-1.5 rounded-full shadow-xs transition-all active:scale-95">
                    👋 Hey, I want to start with you!
                </button>
                <button type="button" 
                        data-message="Tell me more details please!"
                        class="quick-reply-btn text-xs font-medium bg-white hover:bg-pink-50 text-slate-700 hover:text-pink-600 border border-slate-200 hover:border-pink-200 px-3 py-1.5 rounded-full shadow-xs transition-all active:scale-95">
                    ✨ Tell me more details
                </button>
            </div>

            <!-- Interactive Message Input Bar -->
            <form id="chatForm" class="p-3 bg-white border-t border-slate-100 flex items-center gap-2">
                <input type="text" 
                       id="messageInput" 
                       placeholder="Type 'Hey, I want to start with you'..." 
                       autocomplete="off"
                       class="flex-1 bg-slate-100 text-slate-800 placeholder-slate-400 text-sm rounded-full px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500/40 focus:bg-white border border-transparent focus:border-pink-300 transition-all">
                <button type="submit" 
                        aria-label="Send message"
                        class="w-10 h-10 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-white flex items-center justify-center shrink-0 hover:opacity-95 active:scale-95 transition-all shadow-sm">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </section>

        <!-- Primary Bottom WhatsApp Direct CTA Banner -->
        <footer class="p-4 bg-white border-t border-slate-100 space-y-2.5">
            <a href="https://wa.me/917533947819?text=Hey%20Sakshi%2C%20I%20want%20to%20start%20with%20you!" 
               target="_blank" 
               rel="noopener noreferrer"
               class="w-full flex items-center justify-center gap-2.5 py-3.5 px-5 rounded-2xl bg-[#25D366] hover:bg-[#20bd5a] text-white font-semibold text-sm sm:text-base shadow-lg shadow-emerald-500/25 active:scale-[0.99] transition-all">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Chat on WhatsApp • +91 7533947819</span>
            </a>

            <!-- Secondary Link Row -->
            <div class="flex items-center justify-center gap-4 text-xs text-slate-500 pt-0.5">
                <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="hover:text-pink-600 font-medium inline-flex items-center gap-1 transition-colors">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram Profile</span>
                </a>
                <span>•</span>
                <button type="button" id="copyNumberBtn" class="hover:text-slate-800 font-medium inline-flex items-center gap-1 transition-colors">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyBtnText">Copy WhatsApp No.</span>
                </button>
            </div>
        </footer>
    </main>

    <!-- Interactive Chat & Demo Sequence Script -->
    <script>
        (function () {
            const WHATSAPP_URL = "https://wa.me/917533947819?text=Hey%20Sakshi%2C%20I%20want%20to%20start%20with%20you!";
            const AVATAR_URL = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=256&q=80";

            const chatMessages = document.getElementById("chatMessages");
            const chatForm = document.getElementById("chatForm");
            const messageInput = document.getElementById("messageInput");
            const quickReplyBtns = document.querySelectorAll(".quick-reply-btn");
            const resetDemoBtn = document.getElementById("resetDemoBtn");
            const copyNumberBtn = document.getElementById("copyNumberBtn");
            const copyBtnText = document.getElementById("copyBtnText");

            let typingTimeout = null;
            let demoTimeout = null;

            // Safely escape HTML to prevent XSS when users type custom text
            function escapeHTML(str) {
                const div = document.createElement("div");
                div.textContent = str;
                return div.innerHTML;
            }

            // Scroll chat feed smoothly to bottom
            function scrollToBottom() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Append a visitor message bubble (Right aligned, Instagram gradient)
            function appendVisitorMessage(text) {
                const wrapper = document.createElement("div");
                wrapper.className = "flex justify-end";
                wrapper.innerHTML = `
                    <div class="max-w-[82%] bg-gradient-to-r from-pink-500 to-purple-600 text-white text-sm px-4 py-2.5 rounded-2xl rounded-br-sm shadow-sm">
                        <p class="leading-relaxed">${escapeHTML(text)}</p>
                    </div>
                `;
                chatMessages.appendChild(wrapper);
                scrollToBottom();
            }

            // Show "Sakshi is typing..." indicator
            function showTypingIndicator() {
                removeTypingIndicator();
                const typingEl = document.createElement("div");
                typingEl.id = "typingIndicator";
                typingEl.className = "flex items-end gap-2";
                typingEl.innerHTML = `
                    <img src="${AVATAR_URL}" 
                         onerror="this.onerror=null; this.src='https://placehold.co/80x80/ec4899/ffffff?text=SK';"
                         alt="Sakshi" 
                         class="w-7 h-7 rounded-full object-cover shrink-0 border border-slate-200">
                    <div class="bg-white border border-slate-200/80 text-slate-500 text-xs px-3.5 py-2.5 rounded-2xl rounded-bl-sm shadow-xs flex items-center gap-2">
                        <span class="font-medium text-slate-600">Sakshi is typing</span>
                        <span class="flex gap-1">
                            <span class="w-1.5 h-1.5 bg-pink-500 rounded-full animate-bounce"></span>
                            <span class="w-1.5 h-1.5 bg-pink-500 rounded-full animate-bounce [animation-delay:150ms]"></span>
                            <span class="w-1.5 h-1.5 bg-pink-500 rounded-full animate-bounce [animation-delay:300ms]"></span>
                        </span>
                    </div>
                `;
                chatMessages.appendChild(typingEl);
                scrollToBottom();
            }

            function removeTypingIndicator() {
                const existing = document.getElementById("typingIndicator");
                if (existing) existing.remove();
            }

            // Append Sakshi's reply bubble with embedded WhatsApp direct button
            function appendSakshiReply() {
                removeTypingIndicator();
                const wrapper = document.createElement("div");
                wrapper.className = "flex items-end gap-2";
                wrapper.innerHTML = `
                    <img src="${AVATAR_URL}" 
                         onerror="this.onerror=null; this.src='https://placehold.co/80x80/ec4899/ffffff?text=SK';"
                         alt="Sakshi" 
                         class="w-7 h-7 rounded-full object-cover shrink-0 border border-slate-200">
                    <div class="max-w-[85%] bg-white border border-slate-200/80 text-slate-800 text-sm p-3.5 rounded-2xl rounded-bl-sm shadow-sm space-y-3">
                        <p class="leading-relaxed">
                            Hey! Thank you for messaging us. Please come to our WhatsApp for more details! 👇
                        </p>
                        <a href="${WHATSAPP_URL}" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-3.5 rounded-xl bg-[#25D366] hover:bg-[#20bd5a] text-white font-semibold text-xs sm:text-sm shadow-sm transition-all active:scale-95">
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>Message on WhatsApp</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[11px] opacity-90"></i>
                        </a>
                    </div>
                `;
                chatMessages.appendChild(wrapper);
                scrollToBottom();
            }

            // Handle sending any message & triggering Sakshi's typing + reply
            function handleUserMessage(text) {
                const cleanText = text.trim();
                if (!cleanText) return;

                clearTimeout(typingTimeout);
                clearTimeout(demoTimeout);

                appendVisitorMessage(cleanText);
                showTypingIndicator();

                typingTimeout = setTimeout(() => {
                    appendSakshiReply();
                }, 1100);
            }

            // Run the automatic welcome demo flow on page load / replay
            function startDemoSequence() {
                clearTimeout(typingTimeout);
                clearTimeout(demoTimeout);

                chatMessages.innerHTML = `
                    <div class="text-center">
                        <span class="text-[11px] font-medium text-slate-400 bg-white px-2.5 py-0.5 rounded-full border border-slate-100">Today</span>
                    </div>
                `;

                // Step 1: Visitor message appears
                appendVisitorMessage("Hey, I want to start with you!");

                // Step 2: Sakshi typing indicator appears
                demoTimeout = setTimeout(() => {
                    showTypingIndicator();

                    // Step 3: Sakshi's reply with WhatsApp button appears
                    typingTimeout = setTimeout(() => {
                        appendSakshiReply();
                    }, 1200);
                }, 450);
            }

            // Form submit listener
            chatForm.addEventListener("submit", function (e) {
                e.preventDefault();
                const val = messageInput.value;
                if (!val.trim()) return;
                messageInput.value = "";
                handleUserMessage(val);
            });

            // Quick reply chip listeners
            quickReplyBtns.forEach((btn) => {
                btn.addEventListener("click", function () {
                    const msg = this.getAttribute("data-message");
                    handleUserMessage(msg);
                });
            });

            // Replay demo button
            resetDemoBtn.addEventListener("click", startDemoSequence);

            // Copy phone number helper (using execCommand for iFrame compatibility)
            copyNumberBtn.addEventListener("click", function () {
                const tempInput = document.createElement("input");
                tempInput.value = "+91 7533947819";
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand("copy");
                    copyBtnText.textContent = "Copied!";
                    setTimeout(() => {
                        copyBtnText.textContent = "Copy WhatsApp No.";
                    }, 2000);
                } catch (err) {
                    copyBtnText.textContent = "+91 7533947819";
                }
                document.body.removeChild(tempInput);
            });

            // Start demo when page loads
            window.addEventListener("load", startDemoSequence);
        })();
    </script>
</body>
